{% extends "base.html" %}
{% block content %}
<div class="login">
  <h1 style="font-size:28px">Diaz<span style="color:var(--acc)">Bets</span></h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Felhasználónév<input name="username" autocomplete="username" autofocus required></label>
    <label>Jelszó<input name="password" type="password" autocomplete="current-password" required></label>
    <button>Belépés</button>
  </form>
</div>
{% endblock %}
